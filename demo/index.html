<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gsi-field-notes demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.css">
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; }
    body { font: 14px/1.5 system-ui, sans-serif; }
    .panel {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      padding: 8px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.92); color: #111;
    }
    .panel label { margin-right: 8px; }
    .panel output { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="panel">
    <label>preset
      <select id="preset">
        <option value="dark">dark</option>
        <option value="light">light</option>
      </select>
    </label>
    <label>DEM
      <select id="dem">
        <option value="linear">linear(スタイルのまま)</option>
        <option value="fixed">fixed(読み直し)</option>
      </select>
    </label>
    z <output id="zoom">-</output>
  </div>
  <div id="map"></div>

  <script type="module">
    import { Map, NavigationControl, addProtocol } from "https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";
    import { SCHEME, createGsiDemProtocol, withFixedDem } from "../src/gsi-dem-protocol.js";

    const protocol = new pmtiles.Protocol();
    addProtocol("pmtiles", protocol.tile);
    addProtocol(SCHEME, createGsiDemProtocol());

    const params = new URLSearchParams(location.search);
    const presetSelect = document.getElementById("preset");
    const demSelect = document.getElementById("dem");
    presetSelect.value = params.get("preset") === "light" ? "light" : "dark";
    demSelect.value = params.get("dem") === "fixed" ? "fixed" : "linear";

    // DEM を読み直すときだけ、スタイルの標高ソースを差し替える。スタイル JSON 自体は変えない。
    async function loadStyle() {
      const style = await (await fetch(`../styles/${presetSelect.value}.json`)).json();
      return demSelect.value === "fixed" ? withFixedDem(style) : style;
    }

    const map = new Map({
      container: "map",
      style: await loadStyle(),
      center: [142.8, 43.4],
      zoom: 6,
      hash: true,
    });
    map.addControl(new NavigationControl({}), "top-right");
    // コンソールと scripts/capture_comparisons.mjs(描画完了を待って撮影する)から触れるようにする
    window.map = map;

    const zoomOut = document.getElementById("zoom");
    const showZoom = () => { zoomOut.value = map.getZoom().toFixed(1); };
    map.on("zoom", showZoom);
    showZoom();

    // 自前のデータは "load" ではなく "style.load" で足す。"load" は style のソース(地理院の
    // タイル)が揃うまで発火しないので、地理院に届かない環境では自前のデータまで出なくなる。
    // style.load はスタイル差し替えのたびに再発火するので、二重追加をガードする。
    map.on("style.load", async () => {
      if (map.getSource("local")) return;
      const res = await fetch("./local.geojson");
      map.addSource("local", { type: "geojson", data: await res.json() });
      map.addLayer({
        id: "local-point",
        type: "circle",
        source: "local",
        paint: { "circle-radius": 6, "circle-color": "#F2B134", "circle-stroke-width": 2, "circle-stroke-color": "#111" },
      });
    });

    for (const select of [presetSelect, demSelect]) {
      select.addEventListener("change", async () => {
        map.setStyle(await loadStyle());
        params.set(select.id, select.value);
        history.replaceState(null, "", `?${params}${location.hash}`);
      });
    }
  </script>
</body>
</html>
